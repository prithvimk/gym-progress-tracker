name: Android CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Ktlint
        run: ./gradlew ktlintCheck 2>&1 | tee -a build-output.log

      - name: Lint
        run: ./gradlew lintDebug 2>&1 | tee -a build-output.log

      - name: Unit tests
        run: ./gradlew testDebugUnitTest 2>&1 | tee -a build-output.log

      - name: Build debug APK
        run: ./gradlew assembleDebug 2>&1 | tee -a build-output.log

      - name: Check Room schemas are committed
        run: |
          changes="$(git status --porcelain -- app/schemas)"
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "::error::The Room schema changed. Commit the generated files in app/schemas (see the room-schemas artifact)."
            echo "::notice title=schema-bundle::$(git ls-files --others --modified -- app/schemas | tar -cz -T - | base64 -w0)"
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: gym-tracker-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Room schemas
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: room-schemas
          path: app/schemas/
          if-no-files-found: ignore

      - name: Summarize failures
        if: failure()
        run: |
          # Collect compiler, ktlint, lint and test errors into one annotation, readable in the PR checks.
          touch build-output.log
          summary="$(grep -E -A4 '^e: |FAILED|What went wrong|Error: |\.kt:[0-9]+:[0-9]+' build-output.log | head -c 30000)"
          summary="${summary//'%'/'%25'}"
          summary="${summary//$'\n'/'%0A'}"
          echo "::error title=Build failures::${summary:-No error lines found; check the full log.}"

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
