name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    # "closed" only runs the job that deletes the PR's test build.
    types: [opened, synchronize, reopened, closed]

# Pushes to main and each PR queue separately. A merged PR's "closed" run reports main as its ref, so
# keying on the ref alone let it cancel the push build of that same merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Pushes to main update the dev release; pull requests update their own pr-<number> release.
      contents: write
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # Without the secret (fork PRs, or before it is added) builds fall back to a throwaway debug key.
      - name: Set up dev signing key
        env:
          DEV_KEYSTORE_BASE64: ${{ secrets.DEV_KEYSTORE_BASE64 }}
          DEV_KEYSTORE_PASSWORD: ${{ secrets.DEV_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$DEV_KEYSTORE_BASE64" ]; then
            echo "::warning::DEV_KEYSTORE_BASE64 is not set, so this APK cannot update an installed dev build."
            exit 0
          fi
          echo "$DEV_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/dev.keystore"
          echo "DEV_KEYSTORE_PATH=$RUNNER_TEMP/dev.keystore" >> "$GITHUB_ENV"
          echo "DEV_KEYSTORE_PASSWORD=$DEV_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Ktlint
        run: set -o pipefail; ./gradlew ktlintCheck 2>&1 | tee -a build-output.log

      - name: Lint
        run: set -o pipefail; ./gradlew lintDebug 2>&1 | tee -a build-output.log

      - name: Unit tests
        run: set -o pipefail; ./gradlew testDebugUnitTest 2>&1 | tee -a build-output.log

      - name: Build debug APK
        run: set -o pipefail; ./gradlew assembleDebug 2>&1 | tee -a build-output.log

      - name: Check Room schemas are committed
        run: |
          changes="$(git status --porcelain -- app/schemas)"
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "::error::The Room schema changed. Commit the generated files in app/schemas (see the room-schemas artifact)."
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: gym-tracker-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # One rolling pre-release, tagged "dev", always holds the latest main build at fixed URLs:
      # releases/download/dev/gym-tracker-dev.apk and releases/download/dev/version.json.
      - name: Publish dev release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "${DEV_KEYSTORE_PATH:-}" ]; then
            echo "::warning::Skipping the dev release: it needs the DEV_KEYSTORE_BASE64 and DEV_KEYSTORE_PASSWORD secrets."
            exit 0
          fi
          .github/scripts/publish-build.sh dev "Dev build" \
            "Build $VERSION_CODE from ${GITHUB_SHA::7}. Latest build of main."

      # Each open PR gets a pre-release, tagged "pr-<number>", that the in-app updater can install
      # for testing before merging. Fork PRs get no secrets, so they skip this.
      - name: Publish PR test build
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [ -z "${DEV_KEYSTORE_PATH:-}" ]; then
            echo "::warning::Skipping the PR test build: it needs the dev signing key secrets."
            exit 0
          fi
          .github/scripts/publish-build.sh "pr-$PR_NUMBER" "PR #$PR_NUMBER: $PR_TITLE" \
            "Test build $VERSION_CODE of PR #$PR_NUMBER at ${GITHUB_SHA::7}. Deleted when the PR closes."

      - name: Upload Room schemas
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: room-schemas
          path: app/schemas/
          if-no-files-found: ignore

      - name: Summarize failures
        if: failure()
        run: |
          # Collect compiler, ktlint, lint and test errors into one annotation, readable in the PR checks.
          touch build-output.log
          summary="$(grep -E -A4 '^e: |FAILED|What went wrong|Error: |\.kt:[0-9]+:[0-9]+' build-output.log | head -c 30000)"
          summary="${summary//'%'/'%25'}"
          summary="${summary//$'\n'/'%0A'}"
          echo "::error title=Build failures::${summary:-No error lines found; check the full log.}"

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/

  # A closed PR's test build is no longer wanted, so its release and tag go.
  remove-pr-build:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete the PR test build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh release delete "pr-$PR_NUMBER" --cleanup-tag --yes || echo "No test build to delete."
